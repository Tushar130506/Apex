[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "0.1.0"
description = "APEX - Adaptive Performance & Aero eXperimentation: FastF1-based race strategy ML + CFD aero surrogate"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "pyarrow", "joblib"]

[project.optional-dependencies]
ml = ["lightgbm"]
fastf1 = ["fastf1"]
app = ["fastapi", "uvicorn", "pydantic"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
